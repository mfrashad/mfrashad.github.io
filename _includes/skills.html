<div class="skills-wrapper flex wrap row-gt-sm">
  <div class="flex row-gt-sm waypoint" data-animation="slide-in-left">
    <!-- <img src="img/banner-navy.png" class="me"> -->
    
    <picture id="about-picture" class="me">
      <source srcset="img/me-3-4-resized.jpg" width="100px" media="(min-width: 500px)">
      <img src="img/me-3-4-resized.jpg" width="100px" alt="Some picture">
    </picture>
    <!-- <div><img class="up-arrow" src="img/up-arrow.png"></div> -->
    
    <div id="about-content">
      <div class="label bold">About Me</div>
      <div class="excerpt-container fade-effect">
          <p id="excerpt">{{site.data.person.about | truncate: 500, "..." }}</p>
      </div>
      <p class="full-content hidden">{{site.data.person.about}}</p>
      <button class="read-more-btn" dest="about-picture">
        Read More
        <i class="mdi mdi-chevron-double-down page-link"></i>
      </button>
    </div>
  </div>
  

  <!-- <div class="flex flex-50-gt-sm waypoint bars-wrap"  data-animation="slide-in-right">

        <div class="bar fill" style="width:{{skill.width}};">
          <div class="tag bold flex">{{skill.name}}</div>
        </div>
        <span>{{skill.level}}</span>
      </div>
    {% endfor %}
  </div> -->
</div>
