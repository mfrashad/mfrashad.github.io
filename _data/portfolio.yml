projects:
  - id: creativegan
    name: CreativeGAN
    summary: Conference Paper
    description: 
      "Conference paper by MIT DeCoDE lab accepted at ASME IDETC/CIE 2021 Conference. This paper proposes an automated method, named CreativeGAN, for generating
      novel designs. It does so by identifying components that make a
      design unique and modifying a GAN model such that it becomes
      more likely to generate designs with identified unique components. The method combines state-of-art novelty detection, segmentation, novelty localization, rewriting, and generative models
      for creative design synthesis. Using a dataset of bicycle designs,
      we demonstrate that the method can create new bicycle designs
      with unique frames and handles, and generalize rare novelties"
    category: ml
    pictures: 3
    link: http://decode.mit.edu/projects/creativegan
  - id: gancreate
    name: GANCREATE
    summary: AI-Powered Animation Tool
    description: Gancreate enables everyone to make videos easily. Users can quickly convert a script into an editable talking avatar and also animate it using AI motion transfer. Currently, there are 3 types of avatar, face portrait, full body 2d characters, and full body fashion models. Users can easily generate a unique avatar using our AI models. Furthermore, you can edit its attribute such as gender, age, realism and even mix between two avatars. Once you created an avatar, simply give a script or reference video as an input and the app will animate it accordingly.
    category: ml
    pictures: 4
    link: https://devpost.com/software/gancreate
  - id: text2art
    name: Text2Art
    summary: AI-Powered Text-to-Art Generator
    description: Text2Art can generate all kind of arts from pixel art, drawings, photos, to paintings. In addition, Text 2Art also generates a video showing the process of how the art is generated.
    category: ml
    pictures: 3
    link: https://github.com/mfrashad/text2art
  - id: clothinggan
    name: ClothingGAN
    summary: AI-Powered Fashion Design Generator
    description: ClothingGAN is able to generate clothing images and mix these images. While mixing, you can control which structure or style that you want the clothing to copy. Additionally, you can edit the generated clothing with several given attributes such as dark color, jacket, dress, or coat.
    category: ml
    pictures: 3
    link: https://devpost.com/software/clothinggan
  - id: aide_glass
    name: Aide Glass
    summary: Transcribing Smart Glasses for Deaf People
    description: 
      "Aide Glass is a smart glasses that transcribes surrounding voices to text
      that will be shown on the lens. It aims to help hearing impaired people 
      in communicating with normal people using a cheaper alternative solution than hearing aids or implants. The project uses Raspberry Pi, Python and React Native.
      <br><br>The project also won the Chairman's Award in 42nd Science & Engineering Design Exhibition in Malaysia
      out of 160 teams that participated."
    category: electronics
    pictures: 5
  - id: photosketch
    name: PhotoSketch
    summary: Transform Sketch to Playable Game
    description: 
      Hand-drawn sketch game prototyping tool app made for Hack & Roll Hackathon 2020 at NUS, Singapore organized by 
      MLH (Major League Hacking). The app allows user to bring their hand-drawn sketch game design alive (currently limited to 2D platform game).
      <br>PhotoSketch uses Firebase for authentication and database, and use OpenCV hosted with Flask server to do image processing such as
      color filtering and game object type classification to produce the game map data. On the other hand the frontend is made using React Native.
      The app was built together with Chen Nuode.
    pictures: 2
    link: https://github.com/mfrashad/photosketch
  - id: legacybrand
    name: Legacy Brand
    summary: Product Subsription Store
    description: 
      Legacy Brands is an online products and services subscription platform dedicated to rebuilding US inner cities.
      The website is made using Jekyll and integrated with Firebase authentication, Firebase cloud functions, and 
      Stripe payment gateway for subscription system.
    category: web
    pictures: 2
    link: https://www.inspiringamerica.org
  - id: bustime
    name: Bustime
    summary: Bus Live Tracker
    description: Bustime is an app to track real-time location of public buses and predict their time of arrival made during 3 Days of Code Hackathon. The project consist of 2 apps, the first is Driver App for the bus driver to use which will track the bus location and the second is the user app which display the location, route and predicted time arrival of the bus to the user. Technology used are React Native as the mobile front-end and Node.js as the backend.
    category: mobile
    pictures: 4
  - id: ioasis
    name: iOASIS
    summary: Library University App
    description: 
      A mobile app for UTP library. Students are able to search books availability from the app, manage their borrowing period, 
      make appointment with librarians, and many more! The app was made with React Native.
    category: mobile
    pictures: 2
    link: https://play.google.com/store/apps/details?id=com.utp.ioasis&hl=en
  - id: istaid
    name: Istaid Center Website
    summary: Blog Content Management System
    description: 
      An non-profit organization website made with Ruby on Rails. 
      Built with customized CMS (Content Management System) made from scratch using Postgresql as the database
      <br><br> Technologies Used:<br> 
      • Materialize - CSS Framework<br> • Rails - Backend Framework<br> • Postgresql - Database<br> • Amazon EC2 - Hosting Server<br> 
